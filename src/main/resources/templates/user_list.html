<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザ一覧</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; border:none; cursor: pointer;}
        .btn-edit { background-color: #ffc107; color: black; } /* 黄色 */
        .btn-del { background-color: #dc3545; } /* 赤 */
        .top-link { margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>
    <a href="/" class="top-link">← メニューに戻る</a>
    <h1>登録済みユーザ一覧</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>メールアドレス</th>
                <th>Maildir</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.email}">test@example.com</td>
                <td th:text="${user.maildir}">example.com/test/</td>
                <td>
                    <a th:href="@{/user/edit/{id}(id=${user.id})}" class="btn btn-edit">編集</a>
                    
                    <form th:action="@{/user/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-del" onclick="return confirm('本当に削除しますか？');">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
