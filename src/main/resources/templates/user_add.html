<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規ユーザ登録</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
            color: #007bff;
        }

        /* 共通カードデザイン */
        .container {
            max-width: 450px;
            margin: 0 auto 30px auto; /* 下に余白を追加 */
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
            margin-top: 0;
        }
        h1 { font-size: 24px; margin-bottom: 30px; }
        h2 { font-size: 20px; margin-bottom: 20px; color: #17a2b8; border-color: #bee5eb; }

        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        
        input[type="text"], input[type="password"], select, input[type="file"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }

        /* 手動登録ボタン */
        .btn-manual {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-manual:hover { background-color: #0056b3; }

        /* CSV登録ボタン */
        .btn-csv {
            width: 100%;
            padding: 12px;
            background-color: #17a2b8; /* 水色 */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-csv:hover { background-color: #117a8b; }

        .note {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        code {
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <a href="/" class="back-link">← メニューに戻る</a>

    <div class="container">
        <h1>新規ユーザ登録 (手動)</h1>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/user/confirm}" th:object="${userForm}" method="post">
            
            <div class="form-group">
                <label>ドメイン選択</label>
                <select th:field="*{domainId}">
                    <option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}"></option>
                </select>
            </div>
            
            <div class="form-group">
                <label>ユーザ名 (@より前)</label>
                <input type="text" th:field="*{username}" placeholder="例: yamada" required>
            </div>

            <div class="form-group">
                <label>パスワード</label>
                <input type="password" th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label>パスワード (確認)</label>
                <input type="password" th:field="*{confirmPassword}" required>
            </div>

            <button type="submit" class="btn-manual">確認画面へ</button>
        </form>
    </div>

    <div class="container">
        <h2>CSVファイル一括登録</h2>
        
        <div class="note">
            CSV形式: <code>メールアドレス, パスワード</code><br>
            例: <code>test@example.com, pass1234</code>
        </div>

        <form th:action="@{/user/import}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <input type="file" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn-csv">一括登録を実行</button>
        </form>
    </div>

</body>
</html>
