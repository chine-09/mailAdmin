<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登録内容の確認</title>
    <style>
        body { font-family: sans-serif; padding: 20px; color: #333; }
        
        /* ★以前の黄色いデザインに戻しました */
        .confirm-container { 
            background: #fff8e1; 
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid #eec; 
            max-width: 500px; 
            margin: 0 auto; /* 中央寄せ */
        }
        
        .item { margin-bottom: 20px; }
        .label { font-weight: bold; color: #666; font-size: 0.9em; margin-bottom: 5px; }
        .value { font-size: 1.3em; font-weight: bold; } /* 文字を少し大きく */
        
        .buttons { display: flex; gap: 15px; margin-top: 30px; justify-content: center; }
        
        button { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        
        /* 登録ボタン（緑） */
        .btn-regist { background-color: #28a745; color: white; font-weight: bold; }
        .btn-regist:hover { background-color: #218838; }
        
        /* 戻るボタン（白＋枠線） */
        .btn-back { background-color: #fff; color: #666; border: 1px solid #ccc; }
        .btn-back:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 30px;">以下の内容で登録しますか？</h1>

    <div class="confirm-container">
        <div class="item">
            <div class="label">メールアドレス</div>
            <div class="value" th:text="${emailPreview}">user@example.com</div>
        </div>

        <div class="item">
            <div class="label">パスワード</div>
            <div class="value" th:text="${userForm.password}">pass</div>
        </div>

        <div class="buttons">
            <form th:action="@{/user/add/back}" th:object="${userForm}" method="post">
                <input type="hidden" th:field="*{domainId}">
                <input type="hidden" th:field="*{username}">
                <input type="hidden" th:field="*{password}">
                <input type="hidden" th:field="*{confirmPassword}">
                <button type="submit" class="btn-back">戻る</button>
            </form>

            <form th:action="@{/user/register}" th:object="${userForm}" method="post">
                <input type="hidden" th:field="*{domainId}">
                <input type="hidden" th:field="*{username}">
                <input type="hidden" th:field="*{password}">
                <button type="submit" class="btn-regist">登録実行</button>
            </form>
        </div>
    </div>

</body>
</html>
