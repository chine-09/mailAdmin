<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登録内容の確認</title>
    <style>
        body { font-family: sans-serif; padding: 20px; color: #333; }
        .confirm-container { background: #fff8e1; padding: 30px; border-radius: 8px; border: 1px solid #eec; max-width: 500px; }
        .item { margin-bottom: 20px; }
        .label { font-weight: bold; color: #666; font-size: 0.9em; }
        .value { font-size: 1.2em; font-weight: bold; }
        .buttons { display: flex; gap: 10px; margin-top: 30px; }
        button.regist { background-color: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        a.back { display: inline-block; padding: 12px 24px; color: #666; text-decoration: none; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    </style>
</head>
<body>

    <h1>以下の内容で登録しますか？</h1>

    <div class="confirm-container">
        <form th:action="@{/user/register}" th:object="${userForm}" method="post">

            <div class="item">
                <div class="label">メールアドレス (プレビュー)</div>
                <div class="value" th:text="${emailPreview}">user@example.com</div>
            </div>

            <div class="item">
                <div class="label">パスワード</div>
                <div class="value" th:text="*{password}">pass</div>
            </div>

            <input type="hidden" th:field="*{domainId}">
            <input type="hidden" th:field="*{username}">
            <input type="hidden" th:field="*{password}">
            <div class="buttons">
                <a href="/" class="back">戻る</a>
                <button type="submit" class="regist">登録実行</button>
            </div>

        </form>
    </div>

</body>
</html>
