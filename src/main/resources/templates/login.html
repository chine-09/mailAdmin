<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { margin-bottom: 20px; color: #333; font-size: 24px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-bottom: 15px; font-size: 14px; }
        p{font-size: 13px;}
    </style>
</head>
<body>

  

    <div class="login-card">
		<h1>メールサーバ管理システム</h1>
        <h3>システムログイン</h2>
        
        <div th:if="${param.error}" class="error">
            IDまたはパスワードが間違っています
        </div>

        <div th:if="${param.logout}" style="color: green; margin-bottom:15px;">
            ログアウトしました
        </div>

        <form th:action="@{/login}" method="post">
            <input type="text" name="username"  required autofocus placeholder="IDを入力">
            <input type="password" name="password"  required placeholder="passwordを入力">
            <button type="submit">ログイン</button>
        </form>
       
    </div>

</body>
</html>
